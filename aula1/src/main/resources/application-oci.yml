# Ative com --spring.profiles.active=oci; o perfil padrão continua local.
spring:
  config:
    import: "file:${OCI_KAFKA_CONFIG_FILE:${user.home}/.oci/java-eventos/kafka.properties}"
  kafka:
    admin:
      auto-create: false
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
    producer:
      properties:
        enable.idempotence: false # OCI Streaming não implementa produção idempotente.
        max.request.size: 1048576
        retries: 5
        delivery.timeout.ms: 60000
        request.timeout.ms: 30000
        max.block.ms: 60000
    consumer:
      auto-offset-reset: earliest # Grupo novo lê o histórico retido; grupos existentes retomam o commit.
      properties:
        group.protocol: classic
        max.partition.fetch.bytes: 1048576
  autoconfigure:
    exclude: org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
lab:
  kafka:
    topic: ${lab.oci.stream-aula1}
    confirmation-timeout-seconds: 65
    groups:
      risco: aula1-risco-oci
      auditoria: aula1-auditoria-oci
