name: b3-eda-aulas12
services:
  postgres:
    image: docker.io/library/postgres:17.6
    environment:
      POSTGRES_DB: eda
      POSTGRES_USER: aluno
      POSTGRES_PASSWORD: aluno-local
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aluno -d eda"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: docker.io/library/rabbitmq:4.1.4-management
    environment:
      RABBITMQ_DEFAULT_USER: aluno
      RABBITMQ_DEFAULT_PASS: aluno-local
    ports: ["127.0.0.1:5673:5672", "127.0.0.1:15673:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
  kafka:
    image: docker.io/apache/kafka:4.1.2
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
  schema-registry:
    image: docker.io/confluentinc/cp-schema-registry:8.1.1
    profiles: ["contratos"]
    ports: ["127.0.0.1:8085:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    depends_on:
      kafka: {condition: service_healthy}
  aula1:
    build: {context: ., dockerfile: aula1/Dockerfile}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      kafka: {condition: service_healthy}
  aula2:
    build: {context: ., dockerfile: aula2/Dockerfile}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: jdbc:postgresql://postgres:5432/eda
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
volumes:
  postgres-data:
  rabbit-data:
  kafka-data:
